name: Branch sync

on:
  push:
    branches: [dev]
  schedule:
    - cron: '0 14 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: check main is contained in dev
        run: bash scripts/check-branch-sync.sh
